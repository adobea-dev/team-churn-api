[project]
name = "team-churn-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "ucimlrepo>=0.0.7",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["production_app/tests"]
